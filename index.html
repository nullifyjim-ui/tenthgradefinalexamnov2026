lipse cx=\"245\" cy=\"58\" rx=\"12\" ry=\"2.5\" fill=\"#1B1035\" opacity=\".12\"></ellipse><circle cx=\"245\" cy=\"78\" r=\"11\" fill=\"#fff\" stroke=\"#6C3CE9\" stroke-width=\"3\" stroke-dasharray=\"4 3\"></circle><text x=\"245\" y=\"83\" font-family=\"Fredoka,Poppins,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#6C3CE9\" text-anchor=\"middle\">?</text><text x=\"245\" y=\"102\" font-family=\"Fredoka,Poppins,sans-serif\" font-size=\"9\" font-weight=\"700\" fill=\"#6b6480\" text-anchor=\"middle\">can · must · may…</text></svg>", "formula": "can / <b>could</b> / must / should / may / might + <b>be</b> + participio", "ps": ["🎯 <b>Uso:</b>", "• <b>can</b> = habilidad o permiso.<br>• <b>could</b> = ① habilidad general en el pasado y lo que <i>no</i> se logró (<b>couldn't</b>); en afirmativa, un logro puntual usa <b>was/were able to</b>: <i>The police were able to find the thief</i>; ② posibilidad (quizás); ③ petición cortés.<br>• <b>must</b> = obligación.<br>• <b>should</b> = consejo.<br>• <b>may</b> = permiso formal o posibilidad.<br>• <b>might</b> = posibilidad menos segura que may.", "🔔 <b>Palabras clave:</b> maybe, perhaps, possibly, if, when I was young (could en pasado), Could you…?"], "ex": ["<b>🏃 Activa (can):</b> Students <b>can borrow</b> these books.<br><span style=\"font-size:1rem;color:#6b6480;\">Los estudiantes pueden pedir prestados estos libros.</span>", "<b>🎯 Pasiva (can):</b> These books <b>can be borrowed</b>.<br><span style=\"font-size:1rem;color:#6b6480;\">Estos libros pueden ser prestados.</span>", "<b>🏃 Activa (could, posibilidad):</b> They <b>could cancel</b> the trip.<br><span style=\"font-size:1rem;color:#6b6480;\">Ellos podrían cancelar el viaje.</span>", "<b>🎯 Pasiva (could, posibilidad):</b> The trip <b>could be cancelled</b>.<br><span style=\"font-size:1rem;color:#6b6480;\">El viaje podría ser cancelado.</span>", "<b>🏃 Activa (could, pasado):</b> The police <b>couldn't find</b> the thief.<br><span style=\"font-size:1rem;color:#6b6480;\">La policía no pudo encontrar al ladrón.</span>", "<b>🎯 Pasiva (could, pasado):</b> The thief <b>couldn't be found</b> by the police.<br><span style=\"font-size:1rem;color:#6b6480;\">El ladrón no pudo ser encontrado por la policía.</span>", "<b>🏃 Activa (must):</b> You <b>must wear</b> the uniform.<br><span style=\"font-size:1rem;color:#6b6480;\">Debes usar el uniforme.</span>", "<b>🎯 Pasiva (must):</b> The uniform <b>must be worn</b>.<br><span style=\"font-size:1rem;color:#6b6480;\">El uniforme debe ser usado.</span>", "<b>🏃 Activa (should):</b> You <b>should clean</b> the room.<br><span style=\"font-size:1rem;color:#6b6480;\">Deberías limpiar la habitación.</span>", "<b>🎯 Pasiva (should):</b> The room <b>should be cleaned</b>.<br><span style=\"font-size:1rem;color:#6b6480;\">La habitación debería ser limpiada.</span>", "<b>🏃 Activa (may):</b> Visitors <b>may take</b> photos.<br><span style=\"font-size:1rem;color:#6b6480;\">Los visitantes pueden tomar fotos.</span>", "<b>🎯 Pasiva (may):</b> Photos <b>may be taken</b> by visitors.<br><span style=\"font-size:1rem;color:#6b6480;\">Las fotos pueden ser tomadas por los visitantes.</span>", "<b>🏃 Activa (might):</b> The rain <b>might damage</b> the crops.<br><span style=\"font-size:1rem;color:#6b6480;\">La lluvia podría dañar los cultivos.</span>", "<b>🎯 Pasiva (might):</b> The crops <b>might be damaged</b> by the rain.<br><span style=\"font-size:1rem;color:#6b6480;\">Los cultivos podrían ser dañados por la lluvia.</span>", "<b>➖ Negativa:</b> The door <b>couldn't be</b> opened.<br><span style=\"font-size:1rem;color:#6b6480;\">La puerta no pudo ser abierta.</span> &nbsp; <b>❓ Pregunta:</b> <b>Could</b> the door <b>be</b> opened?<br><span style=\"font-size:1rem;color:#6b6480;\">¿La puerta pudo ser abierta?</span>", "<b>⚠️ Ojo:</b> el modal no cambia con el sujeto ni lleva -s: <i>could be repaired</i>, nunca <i>coulds be</i>, <i>could is repaired</i> ni <i>could been repaired</i>."]}]};
